# Strimzi Kafka for the LOCAL kind cluster — single node, NO high availability.
# Self-contained dev override (cluster + topics in one file). Apply THIS on kind instead of
# kafka.yaml + kafka-topics.yaml. Pinned to Strimzi 1.1.0 + Kafka 4.3.0 (API kafka.strimzi.io/v1).
#
# Why a separate file: a 1-node broker CANNOT satisfy replication.factor=3 / replicas=3, so every
# replication setting here is 1. This trades away durability/HA for a tiny laptop footprint.
# DO NOT use this for the chaos experiments (#4) — those need the 3-node kafka.yaml.
---
# One dual-role node: it is the sole KRaft controller AND the sole broker.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: eurotransit
spec:
  # single node (no quorum, no HA) — enough to develop the async pipeline locally
  replicas: 1
  roles:
    - controller
    - broker
  # Memory: keep a 512m heap but give the container generous off-heap headroom. Kafka needs far more
  # than the heap at runtime (network/direct buffers, mmap'd log segments, GC, metaspace); a 1Gi limit
  # left only ~512Mi for all of that and the broker was OOMKilled (137) under saga + Debezium load.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  storage:
    type: persistent-claim
    # smaller disk for local dev
    size: 2Gi
    deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: eurotransit
  namespace: kafka
spec:
  kafka:
    version: 4.3.0
    # internal-only plaintext listener on 9092 (reached as the kafkaBootstrap in values.yaml)
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # single broker -> everything replicated x1 (no other broker to copy to)
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Kafka Exporter also on kind (Fase 4): the chaos dry-runs (exp 04/08) and the Kafka dashboard query
  # kafka_consumergroup_lag — without the exporter here those queries would hit a metric that does not
  # exist locally. Same config as prod (see kafka.yaml for the full rationale).
  kafkaExporter:
    groupRegex: ".*"
    topicRegex: ".*"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
---
# The async saga topics (must match platform/strimzi/kafka-topics.yaml, minus the replica count).
# partitions=3 is fine on one broker (parallelism + per-key ordering); replicas=1 because there is only
# one broker to hold a copy. Groups: commands (Orders->svc), replies (svc->Orders), terminal/notify, and
# one dead-letter topic per consuming service. (There is no order-placed trigger: the saga is driven by
# the synchronous add-leg/pay intake, not a listen-to-yourself event.)
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: reserve-seats
  namespace: kafka
  labels:
    strimzi.io/cluster: eurotransit
spec:
  partitions: 3
  replicas: 1
---
