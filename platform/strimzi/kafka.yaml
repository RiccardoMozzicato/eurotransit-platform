# Strimzi-managed Kafka cluster for the EuroTransit async pipeline (PROD / HA manifest).
# Pinned to Strimzi 1.1.0 + Kafka 4.3.0 (API kafka.strimzi.io/v1). KRaft-only via a KafkaNodePool.
# For LOCAL kind use kafka-kind.yaml instead (single node, RF=1) — far lighter on a laptop.
#
# Sizing trade-off (deliberate): 3 dual-role nodes is the MINIMUM for real HA -> the KRaft controller quorum needs 3 voters to tolerate 1 loss, and RF=3/minISR=2 lets the money path survive 1 broker down with 0 event loss. A single-node Kafka would save circa 2 pods but makes the whole async pipeline a SPOF (single-point-of-failure) and weakens chaos experiment #4
#
# We keep 3 nodes and bound their footprint instead (512m heap + memory limits) -> right-size, don't shrink HA!
---
# A KafkaNodePool declares a set of Kafka nodes with the same roles/resources/storage
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    # ties this pool to the Kafka cluster named "eurotransit" below
    strimzi.io/cluster: eurotransit
spec:
  # 3 nodes = the minimum KRaft quorum that tolerates losing 1
  replicas: 3
  # each node is BOTH a KRaft controller (metadata quorum) and a broker (data)
  roles:
    - controller
    - broker
  # bound the per-node footprint (right-size, don't shrink HA). Sized from LIVE measurement (03/07):
  #  - CPU request 100m: real broker CPU is ~27-30m at rest, so 100m is a generous 3x floor (no CPU limit,
  #    same rationale as the services -> a broker can burst on rebalance/recovery without throttling).
  #  - MEMORY request 768Mi: real RSS is ~715-730Mi (512m heap + page cache + off-heap). An earlier trim to
  #    640Mi was BELOW real usage — a mistake — so it is restored to 768Mi (never under-request). The 1Gi
  #    limit leaves ~40% headroom for GC/recovery spikes, incl. under chaos #4.
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 1Gi
  # JVM heap (kept below the memory limit so off-heap + page cache have room)
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  # durable per-node storage; deleteClaim=false keeps the data if the pool is removed
  storage:
    type: persistent-claim
    size: 5Gi
    deleteClaim: false
  # HA: spread the 3 brokers ONE-PER-NODE. Without this the scheduler co-located all 3 on a single node (seen
  # live 05/07) -> a single node loss takes out the whole KRaft quorum = Kafka down = money path down (would fail
  # chaos-03 node-disruption). requiredDuringScheduling makes 1-broker-per-node a hard guarantee across the 3-node
  # pool; it also rebalances memory off the previously overloaded node. (Losing a broker still keeps 2/3 = quorum.)
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/name: eurotransit-kafka
              topologyKey: kubernetes.io/hostname
---
# The Kafka cluster itself (brokers are provided by the node pool above)
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: eurotransit
  namespace: kafka
  # NOTE: in Strimzi 1.x (Kafka 4.x) node pools + KRaft are the ONLY mode, so the old
  # strimzi.io/node-pools and strimzi.io/kraft annotations are no longer needed.
spec:
  kafka:
    version: 4.3.0
    # internal-only plaintext listener on 9092 (reached as the kafkaBootstrap in values.yaml)
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Durability for the money path: replicate across brokers, require ISR acks.
      # default replication factor for new topics: 3 copies of every partition
      default.replication.factor: 3
      # a write is acked only once >=2 in-sync replicas have it (pairs with producer acks=all)
      min.insync.replicas: 2
      # internal Kafka topics also replicated x3 for the same durability guarantee
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
  # operators that reconcile KafkaTopic / KafkaUser CRs into real topics/users. Without explicit resources
  # Strimzi leaves these two containers UNBOUNDED (no request, no limit) — flagged on k9s (Riccardo, 03/07):
  # an unbounded pod can't be scheduled predictably and a leak could starve a node. Bound both from measured
  # use (entity-operator ~387Mi combined at rest) with headroom.
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 384Mi
    userOperator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 384Mi
  # Kafka Exporter (Fase 4): broker-side consumer-group lag + per-topic offsets, scraped by Prometheus
  # via the PodMonitor in monitoring.yaml. This is the metric source the chaos runbooks and the Kafka
  # dashboard query (kafka_consumergroup_lag, kafka_topic_partition_*_offset) — deliberately the
  # broker-side exporter and NOT the in-app Micrometer Kafka binder, whose metric has a different name
  # (kafka_consumer_fetch_manager_records_lag) and only exists while the consumer pod is alive.
  # After the async cutover lag IS money-path health: it also feeds the DLT-depth alert (offsets delta).
  kafkaExporter:
    # watch every group/topic; aggregation discipline happens at query time (by group/topic, never partition)
    groupRegex: ".*"
    topicRegex: ".*"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
