---
# --- Dead-letter topics: one per consuming service. A poison/exhausted-retry message is parked here by
# the consumer's DefaultErrorHandler + DeadLetterPublishingRecoverer so it never blocks the partition.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: orders-dlt
  namespace: kafka
  labels:
    strimzi.io/cluster: eurotransit
spec:
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: inventory-dlt
  namespace: kafka
  labels:
    strimzi.io/cluster: eurotransit
spec:
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: payments-dlt
  namespace: kafka
  labels:
    strimzi.io/cluster: eurotransit
spec:
  partitions: 3
  replicas: 3
