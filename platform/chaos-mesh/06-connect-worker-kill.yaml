# Chaos experiment 06 — Kafka Connect worker kill (runbook: docs/chaos/06-connect-worker-kill.md).
#
# Goal: prove the Debezium CDC (the ONLY path from a committed outbox row to Kafka since the async cutover)
# is self-healing: killing the worker that runs a connector task makes Connect's group protocol rebalance
# the task onto the surviving worker (2 replicas → 1 left), which resumes exactly where the slot's confirmed LSN left
# off (server-side in PG; connector offsets live in Kafka) -> a publication gap of seconds, zero loss.
#
# MANUAL experiment, NOT GitOps. `mode: one` picks ONE of the 2 workers at random — for a deterministic run
# find the worker hosting the orders-outbox task first (Connect REST /connectors/orders-outbox/status) and
# kill that pod with kubectl instead:
#   kubectl apply -f platform/chaos-mesh/06-connect-worker-kill.yaml
#   kubectl -n kafka get kafkaconnector -o wide -w     # task FAILED/UNASSIGNED -> RUNNING (new worker)
#   kubectl delete -f platform/chaos-mesh/06-connect-worker-kill.yaml
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: connect-worker-kill
  namespace: kafka
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces: [kafka]
    labelSelectors:
      # Strimzi stamps every pod of the Connect cluster (platform/debezium/kafka-connect.yaml, replicas: 2)
      strimzi.io/cluster: debezium-connect
