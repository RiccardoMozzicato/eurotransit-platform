# Chaos experiment 01 — latency injection into Payments (runbook: docs/chaos/01-payments-latency.md).
#
# Goal: prove the Orders->Payments circuit breaker OPENs and fast-fails to the PAYMENT_PENDING
# fallback, while Catalog browsing stays healthy (bulkhead isolation) and the intake ack SLO holds
# (the slow call is off the request thread).
#
# MANUAL experiment, NOT GitOps: this file lives under platform/ (Argo reconciles only deploy/charts/),
# so it never auto-applies. Run it by hand, observe, then delete it:
#   kubectl apply -f platform/chaos-mesh/01-payments-latency.yaml
#   # ...watch breaker state / dashboards under load for ~5 min...
#   kubectl delete -f platform/chaos-mesh/01-payments-latency.yaml   # (auto-stops after `duration` anyway)
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: payments-latency
  namespace: eurotransit
spec:
  action: delay
  # `all` = hit every Payments replica, so the breaker sees the latency regardless of which pod serves the call.
  mode: all
  selector:
    namespaces: [eurotransit]
    labelSelectors:
      # the stable chart label (templates/_helpers.tpl: app.kubernetes.io/name), NOT the `app=` shorthand
      app.kubernetes.io/name: payments
  # `to` delays traffic entering the Payments pods (the request leg). ~3 s comfortably exceeds the breaker's
  # slow-call duration threshold, so a few calls trip it to OPEN — which is exactly the behaviour under test.
  direction: to
  delay:
    latency: "3s"
    jitter: "200ms"
    correlation: "0"
  # auto-revert after 5 minutes even if the delete is forgotten (bounded blast radius)
  duration: "5m"
