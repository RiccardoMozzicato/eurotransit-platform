# Chaos experiment 01 — latency injection into Payments (runbook: docs/chaos/01-payments-latency.md).
#
# Goal (async saga): prove a SLOW CONSUMER never becomes a user-facing failure. Delaying the Payments<->Kafka
# path slows its consumption of authorize/capture commands and the publication of its replies: the failure
# surfaces as consumer lag + orders parked in RESERVED, while the intake ack SLO stays green (the slow step
# is behind Kafka, not on the request thread) and the sweeper re-drives anything parked past PT2M.
# This is the async replacement of the retired Orders->Payments circuit breaker, under test.
#
# MANUAL experiment, NOT GitOps: this file lives under platform/ (Argo reconciles only deploy/charts/),
# so it never auto-applies. Run it by hand, observe, then delete it:
#   kubectl apply -f platform/chaos-mesh/01-payments-latency.yaml
#   # ...watch intake SLIs (flat) + payments consumer lag (grows, then drains) under k6 load for ~5 min...
#   kubectl delete -f platform/chaos-mesh/01-payments-latency.yaml   # (auto-stops after `duration` anyway)
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: payments-latency
  namespace: eurotransit
spec:
  action: delay
  # `all` = every Payments replica, so the lag builds regardless of which pod owns the partitions.
  mode: all
  selector:
    namespaces: [eurotransit]
    labelSelectors:
      # the stable chart label (templates/_helpers.tpl: app.kubernetes.io/name), NOT the `app=` shorthand
      app.kubernetes.io/name: payments
  # delay BOTH legs of the Payments<->Kafka conversation: fetching commands AND producing replies.
  direction: both
  # the other side: the Strimzi broker pods only — Payments' DB path stays untouched (one variable).
  target:
    mode: all
    selector:
      namespaces: [kafka]
      labelSelectors:
        strimzi.io/cluster: eurotransit
  delay:
    latency: "3s"
    jitter: "200ms"
    correlation: "0"
  # auto-revert after 5 minutes even if the delete is forgotten (bounded blast radius)
  duration: "5m"
