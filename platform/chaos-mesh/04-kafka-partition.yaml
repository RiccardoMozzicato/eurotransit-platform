# Chaos experiment 04 — network partition Orders <-> Kafka (runbook: docs/chaos/04-kafka-partition.md).
#
# Goal (async saga — THE central experiment): prove a Kafka outage delays the saga but never corrupts or
# loses it. During the partition POST /api/orders still returns 202 durably (order + outbox row commit in
# PG); Debezium (kafka ns, NOT partitioned) keeps publishing the outbox and the siblings keep replying —
# what stops is Orders CONSUMING. On heal Orders drains the backlog (manual ack = nothing lost), the sweeper
# re-drives anything parked past PT2M, and UNIQUE dedup absorbs the re-drives -> the system converges.
#
# RUN for ~3 min under steady load, then let it heal (auto-revert via `duration`):
#   kubectl apply -f platform/chaos-mesh/04-kafka-partition.yaml
#   # OBSERVE during: intake still 202; orders group's consumer lag balloons (outbox stays ~drained: Debezium is NOT cut)
#   # OBSERVE after:  lag -> ~0, each order reaches exactly one terminal state, no duplicates
#   kubectl delete -f platform/chaos-mesh/04-kafka-partition.yaml
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: orders-kafka-partition
  namespace: eurotransit
spec:
  action: partition
  mode: all
  # one side of the partition: the Orders pods
  selector:
    namespaces: [eurotransit]
    labelSelectors:
      app.kubernetes.io/name: orders
  # block traffic in BOTH directions between Orders and the Kafka brokers
  direction: both
  # the other side: the Strimzi-managed Kafka broker pods (ns `kafka`). Strimzi stamps every pod of our
  # cluster with `strimzi.io/cluster: eurotransit`. RF=3/minISR=2 means the cluster itself stays writable;
  # here we cut ORDERS off from it specifically, which is the scenario the outbox is designed for.
  target:
    mode: all
    selector:
      namespaces: [kafka]
      labelSelectors:
        strimzi.io/cluster: eurotransit
  duration: "3m"
