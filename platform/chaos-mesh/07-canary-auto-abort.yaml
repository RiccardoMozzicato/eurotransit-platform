# Chaos experiment 07 — degrade the CANARY during a rollout -> Argo Rollouts auto-abort
# (runbook: docs/chaos/07-canary-auto-abort.md — Fase 5 ✕ Fase 6).
#
# Goal: prove the canary analysis aborts a bad release with NO human in the loop. We delay the canary pods'
# path to orders-db by 2 s: the POST /api/orders ack (whose write path crosses the DB) blows the 300 ms p99
# gate of the AnalysisTemplate; after `failureLimit` (3) failed measurements (~90 s) the controller aborts —
# TraefikService weights snap back to 100/0 stable, canary drains. Stable pods are NEVER selected.
#
# The ONLY label distinguishing canary from stable pods is the canary ReplicaSet's pod-template hash, which
# changes per release — grab it while the ramp is at a low weight and substitute the placeholder:
#   HASH=$(kubectl -n eurotransit get rs -l app.kubernetes.io/name=orders \
#     -o jsonpath='{range .items[*]}{.metadata.labels.rollouts-pod-template-hash} {.spec.replicas}{"\n"}{end}' \
#     | awk '$2>0' | tail -1 | cut -d' ' -f1)
#   sed "s/REPLACE_WITH_CANARY_HASH/$HASH/" platform/chaos-mesh/07-canary-auto-abort.yaml | kubectl apply -f -
# Cleanup after the abort:
#   kubectl -n eurotransit delete networkchaos canary-db-latency
#
# Prereqs: Fase-5 Rollouts merged + analysis enabled (Prometheus present -> AKS, or kind + kube-prometheus).
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: canary-db-latency
  namespace: eurotransit
spec:
  action: delay
  mode: all
  selector:
    namespaces: [eurotransit]
    labelSelectors:
      app.kubernetes.io/name: orders
      # the canary ReplicaSet's hash — substitute per release (see header)
      rollouts-pod-template-hash: REPLACE_WITH_CANARY_HASH
  # delay only the canary -> orders-db leg: the intake ack path crosses the DB, so the canary's p99 blows
  # the analysis gate while its Kafka consumption merely slows (one variable, decisive signal)
  direction: to
  target:
    mode: all
    selector:
      namespaces: [eurotransit]
      labelSelectors:
        cnpg.io/cluster: orders-db
  delay:
    latency: "1200ms"
    jitter: "100ms"
    correlation: "0"
  # longer than failureLimit x interval (3 x 30 s) + margin; auto-reverts even if the delete is forgotten
  duration: "8m"
