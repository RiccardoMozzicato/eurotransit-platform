# Argo CD "Application" -> the GitOps contract: "keep the cluster equal to THIS path of THIS repo". Applied once at platform bootstrap; from then on, Argo CD reconciles
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eurotransit
  # Application CRs live in Argo CD's own namespace, NOT in the app namespace
  namespace: argocd
  # With this finalizer, deleting the Application also deletes the resources it created (cascade delete) instead of orphaning them in the cluster
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # ServerSideDiff: compute the diff via a server-side-apply dry-run so fields OWNED BY OTHER managers
    # (the CNPG operator defaulting the Cluster .spec, the Rollouts controller) are NOT reported as drift.
    # This is the modern remedy for the perpetual CNPG-Cluster OutOfSync (Argo CD >= 2.10).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  # WHAT to deploy: render this Helm chart from this repo/branch/path
  source:
    repoURL: https://github.com/RiccardoMozzicato/eurotransit-platform.git
    targetRevision: main
    path: deploy/charts/eurotransit
    helm:
      valueFiles:
        - values.yaml
  # WHERE to deploy: the local cluster (the one Argo CD runs in), namespace eurotransit
  destination:
    server: https://kubernetes.default.svc
    namespace: eurotransit
  # Fase 5 — fields the ARGO ROLLOUTS controller owns at runtime and Argo CD must not fight over:
  # the orders/orders-canary(/preview) Service selectors (Rollouts injects rollouts-pod-template-hash to
  # pin each Service to its ReplicaSet) and the orders-weighted TraefikService weights (Rollouts drives
  # them step by step; Git deliberately declares NO weight). managedFieldsManagers scopes the ignore to
  # exactly the fields that controller wrote (server-side-apply field ownership), nothing else.
  ignoreDifferences:
    - group: ""
      kind: Service
      managedFieldsManagers:
        - argo-rollouts
    - group: traefik.io
      kind: TraefikService
      managedFieldsManagers:
        - argo-rollouts
    # CloudNativePG: the operator's mutating webhook DEFAULTS a large part of the Cluster .spec that our
    # minimal Git manifest doesn't set (affinity, enablePDB, enableSuperuserAccess, failoverDelay,
    # bootstrap.initdb locale, postgresql.parameters, probes, ...). Those fields are owned by the operator's
    # field manager ("manager"), NOT by argocd-controller, so Argo saw them as a perpetual drift -> the 4
    # DB Clusters stayed OutOfSync forever (verified 04/07: it was CNPG, NOT the Rollouts fields). Ignoring
    # the operator-owned fields makes Argo compare only what WE declare. Purely cosmetic (the DBs work); this
    # just removes the false yellow so a REAL drift wouldn't hide in the noise.
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    # automated = reconcile without a human clicking "Sync":
    #   prune    -> delete cluster resources that were removed from Git
    #   selfHeal -> revert manual (out-of-band) changes made with kubectl
    # Together these make Git the single source of truth
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Server-side apply plays better with large CRDs (CloudNativePG Cluster, etc...)
      - ServerSideApply=true
      # honour ignoreDifferences DURING sync too (not only in the diff view), or selfHeal would still
      # revert the Rollouts-managed weights/selectors on every reconcile
      - RespectIgnoreDifferences=true
