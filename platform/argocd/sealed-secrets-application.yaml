# Argo CD Application for the Sealed Secrets controller — the ONE canonical installation.
# Fixes the two-controller split (a sealed-secrets-ns v0.31.0 + a kube-system v0.37.0 = two keypairs,
# which is why the only SealedSecret failed to decrypt — docs/cluster-topology.md Known Issue #3).
# GitOps-managed like argo-rollouts/debezium: the controller that decrypts our SealedSecrets is itself
# declared in Git. sync-wave -10 so it exists (and its cert is available) before any SealedSecret applies.
#
# BOOTSTRAP NOTE — applying this on a live cluster ADOPTS/replaces the existing controller. Sequence
# (rehearse on kind first; see platform/sealed-secrets/README.md):
#   1) back up the surviving key (kubectl -n sealed-secrets get secret -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml) — store OUT of Git
#   2) helm uninstall the kube-system controller
#   3) re-seal every SealedSecret against THIS controller's cert (platform/secrets/seal.sh)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    # chart 2.18.6 = app v0.37.0 — matches the kubeseal client we seal with (v0.37.0). Standardises on the
    # newer of the two live controllers; supersedes the sealed-secrets-ns v0.31.0 install.
    targetRevision: 2.18.6
    helm:
      valuesObject:
        # fixed name so kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets resolves
        fullnameOverride: sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
