# Argo CD Application that reconciles the committed SealedSecrets (the class-C app secrets: keycloak-db,
# keycloak-bootstrap-admin, the *-db-debezium managed-role creds + the kafka-ns debezium-db, and paypal-api).
# Fixes the gap where these were hand-created out-of-band (docs/cluster-topology.md Known Issue #4): the
# controller (Application: sealed-secrets, wave -10) unseals them into the Secrets that CNPG managed roles,
# Keycloak, the Connect cluster and payments consume. sync-wave -3: after the controller + namespaces, BEFORE
# the eurotransit app chart (wave 0) reconciles the CNPG Clusters / Keycloak that read them.
#
# The sealed manifests each carry their own `namespace:` (eurotransit + kafka); the `include` filter keeps
# Argo from trying to apply seal.sh / README.md as manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eurotransit-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/DarioBerti/capstone-configuration-g03.git
    targetRevision: main
    path: platform/secrets
    directory:
      include: "*-sealedsecret.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: eurotransit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
