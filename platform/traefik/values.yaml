# Traefik BASE values — shared by ALL environments (kind + real cluster).
# Only environment-agnostic, app-facing settings live here. Networking/scheduling that
# differs per environment lives in the overlays, layered on top at install time:
#
#   local kind : helm ... -f values.yaml -f values-kind.yaml
#   real cloud : helm ... -f values.yaml -f values-prod.yaml
#
# (Later -f files win on conflicts; maps deep-merge, lists are replaced.)

# Register an IngressClass named exactly "traefik" so the app chart's
# `ingressClassName: traefik` (deploy/charts/eurotransit/templates/ingress.yaml) resolves here.
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

# Watch standard networking.k8s.io/v1 Ingress objects (what the app chart emits).
providers:
  kubernetesIngress:
    enabled: true