# Production ClusterIssuer: real Let's Encrypt certificates via the ACME HTTP-01 challenge,
# solved through the Traefik ingress.
#
# Preconditions on the real cluster:
#   - public DNS record (g03.cpo2026.it) resolves to the Traefik LoadBalancer external IP
#   - port 80 is reachable from the internet (HTTP-01 hits /.well-known/acme-challenge/...)
#
# The app chart's Ingress selects this via global.clusterIssuer: letsencrypt-prod (base values.yaml).
# Do NOT apply this on kind — it would attempt ACME validation and fail.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt PRODUCTION endpoint. It is rate-limited; while testing, switch to staging:
    #   https://acme-staging-v02.api.letsencrypt.org/directory
    server: https://acme-v02.api.letsencrypt.org/directory
    # TODO: set the team contact address — Let's Encrypt sends expiry/issue warnings here.
    email: team-g03@example.com
    # cert-manager stores the ACME account private key in this Secret.
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik