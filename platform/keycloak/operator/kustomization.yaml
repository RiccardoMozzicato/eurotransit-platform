# Keycloak Operator install (raw manifests from the upstream keycloak-k8s-resources release).
# Provides the Keycloak + KeycloakRealmImport CRDs (cluster-scoped) and the operator Deployment.
#
# The operator is deployed INTO the eurotransit namespace so it reconciles the Keycloak CR + realm import
# that the eurotransit chart ships there (the non-OLM operator watches its own namespace). The two CRD
# resources are cluster-scoped, so the namespace setting is a no-op for them.
#
# Pin to the Keycloak minor that matches keycloak.image in the chart (quay.io/keycloak/keycloak:26.0).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eurotransit
resources:
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.0.0/kubernetes/keycloaks.k8s.keycloak.org-v1.yml
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.0.0/kubernetes/keycloakrealmimports.k8s.keycloak.org-v1.yml
  - https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/26.0.0/kubernetes/kubernetes.yml
