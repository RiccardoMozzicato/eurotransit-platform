# EuroTransit -> desired application state (the chart's control panel: every template reads from here). CI (application repo) bumps "services.<svc>.image.tag" after a successful image build; Argo CD reconciles. Keep image tags as the only CI-mutated field!

# Values shared by all services / templates
global:
  # container registry that hosts the service images (ACR del gruppo, sub "Azure for Students")
  registry: labg03clusterregistry.azurecr.io
  # image path prefix: full image = <registry>/<imagePrefix>/<service>
  imagePrefix: eurotransit
  # public host the Ingress serves (TLS cert issued for this name). Real subdomain: the wildcard
  # *.g03.cpo2026.it resolves to the Traefik LB, and the Keycloak client redirect derives from this host.
  domain: app.g03.cpo2026.it
  # cert-manager ClusterIssuer that signs the Ingress TLS cert (Secret eurotransit-tls).
  # Default = real Let's Encrypt (Argo CD / prod render base values.yaml only).
  # Local kind overrides this to "selfsigned" in values-kind.yaml (LE can't validate a laptop).
  clusterIssuer: letsencrypt-prod
  # Kafka bootstrap exposed by the Strimzi-managed cluster (platform namespace)
  kafkaBootstrap: eurotransit-kafka-bootstrap.kafka.svc:9092
  # Where every service ships its OTLP traces: the OpenTelemetry Collector gateway (Service
  # `otel-collector` in ns `observability`, platform-installed). Centralised here so a move of the
  # collector's name/namespace is a one-line change instead of editing the Deployment template; kind
  # can override it in values-kind.yaml. Services stay backend-agnostic (they only know "send OTLP here").
  otlpEndpoint: http://otel-collector.observability.svc:4318/v1/traces
  # Console log format for every service, injected as LOGGING_STRUCTURED_FORMAT_CONSOLE (overrides the
  # app's application-cluster.yml). `ecs` = structured ECS JSON for a log pipeline to parse (Pillar D
  # log<->trace correlation). kind overrides this to "" (plaintext) in values-kind.yaml, having no log
  # aggregation stack.
  logFormat: ecs
  # OIDC contract injected into every secured service (validates Keycloak JWTs). The `issuer` MUST equal
  # the `iss` claim Keycloak stamps on tokens (the public frontend URL); jwkSetUri/tokenUri point at the
  # same public realm. kind overrides these in values-kind.yaml.
  oidc:
    issuer: https://auth.g03.cpo2026.it/realms/eurotransit
    jwkSetUri: https://auth.g03.cpo2026.it/realms/eurotransit/protocol/openid-connect/certs
    tokenUri: https://auth.g03.cpo2026.it/realms/eurotransit/protocol/openid-connect/token
  # Price-quote signing keypair. Catalog SIGNS browse-time price quotes with the private half; Orders VERIFIES
  # them with this PUBLIC half (injected as PRICE_QUOTE_PUBLIC_KEY) — so Catalog stays off the money path. The
  # public key is non-secret; the matching PRIVATE key reaches catalog via the `price-quote-signing` Secret
  # (SealedSecret in prod / priceQuote.devSecrets plaintext on kind). This is the DEV keypair's public half;
  # replace BOTH halves together for a real deployment (keep them a matching pair or every add-leg 400s).
  pricing:
    publicKey: '{"kty":"EC","crv":"P-256","kid":"price-quote-dev","x":"88QMkhVI-Xygzue616voDrIHFU9DZrxo91Np99RGL8I","y":"yE9kgtizYUeBDJCYNttyrHhAi5zWukU85bIHKr4CIc0","alg":"ES256"}'
  # Browser security response headers for the storefront (templates/security-headers.yaml -> Traefik Middleware,
  # attached to the app Ingress + the canary orders IngressRoute). HSTS is PROD-ONLY via stsSeconds; kind sets it
  # to 0 (values-kind.yaml) because a self-signed cert + HSTS locks the browser out of https://*.localhost.
  # keycloakOrigin is the BROWSER-FACING Keycloak host, allowed in the CSP connect-src/frame-src for OAuth2/PKCE.
  securityHeaders:
    enabled: true
    stsSeconds: 31536000
    keycloakOrigin: https://auth.g03.cpo2026.it
# The SPA storefront, hosted IN-CLUSTER (nginx serving the Vite build) as the PRODUCTION frontend. When
# enabled, the ingress serves the SPA at "/" and adds ONLY the public routes it needs: the secured
# notifications SSE stream and the narrow /api/inventory/availability read (Payments + the broad Inventory
# surface stay internal). `exposeInternalDebugRoutes` is a SEPARATE dev-only switch that also opens the broad
# /api/inventory + /api/payments prefixes for the local debug SPA — it MUST stay false here; values-kind.yaml
# flips both on. image.tag is CI-bumped (build-frontend job) like the services.
frontend:
  enabled: true
  # DEV-ONLY: also route the broad /api/inventory + /api/payments prefixes (debug SPA). Never true in prod.
  exposeInternalDebugRoutes: false
  image:
    repository: labg03clusterregistry.azurecr.io/eurotransit/frontend
    tag: "cf37fe7"
    pullPolicy: IfNotPresent
  replicaCount: 1
  # cluster Service port (nginx listens on 80 inside the pod)
  port: 80
# Keycloak (OIDC identity provider), run by the Keycloak Operator (installed separately as a platform
# component — see platform/argocd/keycloak-operator-application.yaml). The Keycloak CR + realm import live
# in THIS chart so they share the eurotransit namespace and the shared catalog Postgres instance.
keycloak:
  enabled: true
  # Quarkus distribution image the operator runs
  image: quay.io/keycloak/keycloak:26.0
  instances: 1
  # public host for the login UI (cert-manager issues its TLS cert); kind overrides this
  hostname: auth.g03.cpo2026.it
  # Keycloak's database lives on the SHARED catalog-db CNPG cluster (see databases.catalog-db below):
  # this is the host/db Keycloak connects to and the secret holding its DB role credentials.
  db:
    host: catalog-db-rw.eurotransit.svc
    name: keycloakdb
    secret: keycloak-db # keys: username, password (also used by the CNPG managed role)
  # secret holding the bootstrap admin user (keys: username, password). MUST NOT be named
  # "<keycloak-cr-name>-initial-admin" (i.e. keycloak-initial-admin): that name is reserved for the
  # secret the operator generates itself, and a collision makes the operator's reconcile 409 and abort.
  adminSecret: keycloak-bootstrap-admin
  # LOCAL-ONLY: render plain Secrets so kind works without kubeseal. MUST stay false in this base file;
  # in prod the secrets (keycloak-db, keycloak-bootstrap-admin) are committed as
  # SealedSecrets (see platform/keycloak/README.md). values-kind.yaml flips this to true.
  devSecrets: false
  dev:
    adminUsername: admin
    adminPassword: admin
    dbPassword: keycloak-dev-pass
  # Frontend (SPA) client knobs. Base = prod only: the public domain is always allowed; dev appends
  # localhost in values-kind.yaml. directAccessGrants stays OFF in prod (no password grant on a public
  # client) — kind turns it on so test accounts can mint a token via curl.
  frontend:
    extraRedirectUris: []
    extraWebOrigins: []
  devDirectAccessGrants: false
  # Pre-seeded test accounts for the eurotransit realm. values-kind.yaml adds more for local logins.
  # Each entry: { username, email, firstName, lastName, password, roles: [USER|ADMIN ...] }
  # NOTE: passwords here are PLAINTEXT in Git — keep this to throwaway TEST accounts only, never real users.
  testUsers:
    - username: admin
      email: admin@eurotransit.test
      firstName: Admin
      lastName: Test
      password: admin
      roles: [USER]
# Per-service desired state
# "db" references a database name in ".databases" (or null)
# "criticalPath" marks services on the money path (drives PDBs / spread / stricter SLOs)
# "hpa.enabled: true" lets the HPA own scaling -> the Deployment then omits "replicas", so Argo CD and the HPA don't fight over the replica count ("replicaCount" stays as the documented baseline and drives the PDB threshold)
services:
  catalog:
    image:
      # full image reference; "tag" is the only field CI rewrites (to the commit SHA)
      repository: labg03clusterregistry.azurecr.io/eurotransit/catalog
      tag: cf37fe7
      # IfNotPresent = don't re-pull if the tag is already cached on the node
      pullPolicy: IfNotPresent
    # baseline replica count (also the HPA floor / PDB reference)
    replicaCount: 2
    # container port the service listens on
    port: 8080
    # the CloudNativePG database this service owns (see "databases" below)
    db: catalog-db
    # OAuth2 resource server -> inject the OIDC env (global.oidc) so it validates Keycloak JWTs
    secured: true
    # Signs browse-time price quotes: inject the EC PRIVATE key PRICE_QUOTE_SIGNING_KEY from the
    # `price-quote-signing` Secret (SealedSecret in prod; priceQuote.devSecrets plaintext on kind).
    signsPriceQuotes: true
    # NOT on the money path -> no PDB, no topology spread, looser SLOs
    criticalPath: false
    # Consumes Inventory's seat-availability events (read-side availability projection, off the money path)
    # -> inject KAFKA_BOOTSTRAP. Consume-only: Catalog never produces domain events and never blocks checkout.
    usesKafka: true
    # Public read endpoint: bursty browse traffic is the natural HPA case
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
  orders:
    image:
      repository: labg03clusterregistry.azurecr.io/eurotransit/orders
      #tag: 4407f01 # old to perform rollout
      tag: a264fa0
      pullPolicy: IfNotPresent
    replicaCount: 2
    port: 8080
    db: orders-db
    # on the money path -> gets a PDB + topology spread
    criticalPath: true
    usesKafka: true
    # validates inbound user JWTs (resource server)
    secured: true
    # Orders prices a leg from Catalog's signed browse-time quote, VERIFIED LOCALLY with the EC PUBLIC key — no
    # sync call to Catalog on the money path. Injects PRICE_QUOTE_PUBLIC_KEY (non-secret) from global.pricing.publicKey;
    # Orders never holds the private key (least privilege).
    verifiesPriceQuotes: true
    # NB (async saga): Orders makes NO sync calls to Inventory/Payments — it emits Kafka commands and reacts to
    # replies, so it needs no sibling base-URLs and no service-token client: the former oidcClient (orders-svc /
    # orders-oidc) and the INVENTORY/PAYMENTS_BASE_URL env were removed with the sync→async cutover. It stays a
    # resource server (secured) to validate the inbound user JWT on POST /api/orders.
    # Housekeeping knob: the abandoned-DRAFT cleanup sweeper (AbandonedDraftSweeper), tunable HERE without
    # rebuilding the image — Spring relaxed binding maps these to app.draft-sweeper.*. A change rolls the pod via
    # Argo, which re-reads them at startup (@Scheduled/@Value bind once per boot — there is no hot reload). Keep
    # poll-interval << max-age: @Scheduled fixedDelay resets on every restart, so a multi-day interval could
    # otherwise never fire on a service that redeploys often (canary). Set ENABLED=false to turn it off entirely.
    extraEnv:
      APP_DRAFT_SWEEPER_ENABLED: "true"
      APP_DRAFT_SWEEPER_POLL_INTERVAL: "PT1H"
      APP_DRAFT_SWEEPER_MAX_AGE: "PT3H"
      # The ONE synchronous Orders -> Payments call: open a PayPal Card-Fields session before pay. Points at the
      # in-cluster payments Service (stable ClusterIP even under the canary rollout). Only exercised when
      # payments.paypal.enabled (Card Fields on); harmless otherwise.
      PAYMENTS_BASE_URL: http://payments:8080
    # Public sync entry of the money path: scale out under load instead of queueing to collapse (works together with load shedding / 429, Pillar C)
    # maxReplicas capped 4->3 (05/07): on the memory-tight pool a cold-start CPU spike ballooned orders to 4 pods
    # (~4x448Mi) with no lasting need (idle CPU ~39%); 3 keeps burst headroom while bounding the memory footprint.
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    # Fase 5 — progressive delivery (Argo Rollouts). With a strategy set, the orders workload renders as a
    # Rollout CRD instead of a Deployment and the controller executes the release policy below on EVERY image
    # bump (CI bumps the tag -> Argo CD syncs -> the Rollout sees a new pod template and starts the ramp).
    # strategy: "canary" | "bluegreen" | "" (empty = plain Deployment, no progressive delivery).
    #
    # canary: ramps /api/orders traffic stable->canary through the weighted TraefikService `orders-weighted`
    # (weights are PATCHED at runtime by the Rollouts controller — never declared in Git; the Argo CD app
    # ignores the controller-managed fields). Each step holds `pause` while the background AnalysisRun
    # (templates/analysis.yaml: canary-scoped SLO + consumer-failure queries) keeps gating: a failed analysis
    # auto-aborts the rollout and resets the weight to 0 = instant rollback to stable, no human in the loop.
    #
    # NB (async saga): the weight governs ONLY the HTTP intake. Canary pods join the SAME Kafka consumer group
    # as stable, so saga replies are consumed by canary code too — `canaryReplicas: 1` bounds that exposure to
    # one pod during the ramp and the analysis watches the canary's consumer failure rate, but the hard release
    # invariant is EVENT COMPATIBILITY between versions (see docs/design.md §4-D).
    #
    # bluegreen: the preview runs at full capacity next to the active colour; promotion flips the `orders`
    # Service selector atomically (manual gate: `kubectl argo rollouts promote orders`); rollback = `undo`.
    # The async caveat applies double here: the preview consumes saga replies at full share BEFORE promotion.
    rollout:
      strategy: canary
      canary:
        # Each step: (optional) pin the canary ReplicaSet size, set the TraefikService weight, hold `pause`
        # while the analysis runs. `canaryReplicas` bounds the Kafka consumer-side exposure; `matchTrafficWeight`
        # releases the pin so the canary scales with its traffic share. Full promotion follows the last step.
        steps:
          - canaryReplicas: 1
            weight: 5
            pause: 2m
          - weight: 25
            pause: 2m
          - matchTrafficWeight: true
            weight: 50
            pause: 5m
        # SLO-gated promotion (AnalysisTemplate <svc>-canary-slo). Needs Prometheus (kind turns this off:
        # there the steps gate on the pauses alone and promote/abort stay manual judgement calls).
        analysis:
          enabled: true
      bluegreen:
        # never auto-cutover: a human promotes after smoke-testing the preview Service in-cluster
        autoPromotionEnabled: false
  inventory:
    image:
      repository: labg03clusterregistry.azurecr.io/eurotransit/inventory
      tag: c9b530a
      pullPolicy: IfNotPresent
    replicaCount: 2
    port: 8080
    db: inventory-db
    criticalPath: true
    usesKafka: true
    secured: true
    # Deliberately NO HPA: the bottleneck is the single contended row in PostgreSQL, not service CPU -> more replicas would not increase reservation throughput
    hpa:
      enabled: false
  payments:
    image:
      repository: labg03clusterregistry.azurecr.io/eurotransit/payments
      tag: b74f0a0
      pullPolicy: IfNotPresent
    replicaCount: 2
    port: 8080
    db: payments-db
    criticalPath: true
    usesKafka: true
    secured: true
    # PayPal (sandbox) server-to-server PSP. enabled:true flips PAYMENTS_PROVIDER=paypal in-cluster and injects
    # the credentials + sandbox test card from the `paypal-api` secret (a committed SealedSecret in prod; the
    # paypal.devSecrets-gated plaintext on kind). Set enabled:false to keep payments on the in-app mock PSP.
    # NOTE: with enabled:true the `paypal-api` secret MUST exist in-cluster (same contract as orders-oidc).
    paypal:
      enabled: true
      baseUrl: https://api-m.sandbox.paypal.com
      secretName: paypal-api
    # Deliberately NO HPA: work is I/O-bound on the external PSP + idempotency store
    hpa:
      enabled: false
  notifications:
    image:
      repository: labg03clusterregistry.azurecr.io/eurotransit/notifications
      tag: 4407f01
      pullPolicy: IfNotPresent
    # single replica: this service is allowed to be fully down (graceful degradation)
    replicaCount: 1
    port: 8080
    # owns no database (almost stateless: an in-memory ring buffer only)
    db: null
    criticalPath: false
    usesKafka: true
    # One authenticated surface only: the per-user SSE stream (/api/notifications/orders/{id}/events) that
    # relays saga updates to the browser -> validate the caller's Keycloak token (lazy decoder, so readiness
    # never couples to Keycloak). Still a pure sink: it never calls the money path.
    secured: true
    # The SSE stream authorizes the caller by asking Orders "do you own this order?" (the ONE remaining sync
    # cross-service HTTP call — see notifications OrdersClient). Without this the app falls back to its dev
    # default http://localhost:8080 and the check hits notifications ITSELF -> 404 -> every stream 404s. Point
    # it at the in-cluster Orders Service (its stable ClusterIP even under the canary rollout).
    extraEnv:
      ORDERS_BASE_URL: http://orders:8080
    # Allowed to fail entirely (graceful degradation): one replica, no HPA, no PDB. Single-replica is also what
    # lets the SSE hub hold every connection AND consume every event in one process — no cross-pod fan-out.
    hpa:
      enabled: false
  users:
    image:
      repository: labg03clusterregistry.azurecr.io/eurotransit/users
      tag: 8ed53f1
      pullPolicy: IfNotPresent
    replicaCount: 2
    port: 8080
    # owns its own database (app-side profiles keyed by the Keycloak subject)
    db: users-db
    # OAuth2 resource server -> validates Keycloak JWTs; provisions profiles just-in-time
    secured: true
    # off the money path (profiles are not part of checkout)
    criticalPath: false
    usesKafka: false
    # self-service profile reads scale with logged-in browse traffic
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
# CloudNativePG Cluster CRs (operator is platform-level). One DB per data-owning service!
#
# Replication posture = our PACELC statement made real: CNPG replicates ASYNCHRONOUSLY by default, which means a failover can lose the last committed transactions (RPO > 0). For inventory that would break "never oversell" exactly under chaos experiment #5 (a committed reservation vanishes, the seat counter rolls back, the seat is sold twice). Hence:
#
#   - inventory-db: SYNCHRONOUS replication, dataDurability=required → RPO=0 always. 3 instances (ANY 1 of 2 standbys) so losing ONE replica does not block writes; if the primary is partitioned from both standbys, writes BLOCK = consistency over availability (PACELC PC/EC). Resource-saving variant: 2 instances (1 pod less) is also defensible but blocks writes whenever the single standby is down
#
#   - orders-db: SYNCHRONOUS "preferred" → RPO=0 in normal operation, degrades to async instead of blocking order intake if the standby disappears (the money-path invariants do not live in orders-db; losing intake availability costs more)
#
#   - payments-db: single instance (team decision 09/06): not contended; no-double-charge is enforced by the idempotency table, not by replication; unavailability is contained by the Orders circuit breaker + fallback
#
#   - catalog-db: single instance; staleness-tolerant by definition
#
# Debezium CDC: the outbox relay is Kafka Connect + Debezium (platform/debezium/) reading outbox_events off
# each money-path DB's WAL. The connector authenticates as the CNPG-managed `debezium` role (see databases
# below); its password is supplied per-DB by a `<db>-debezium` secret.
debezium:
  # LOCAL-ONLY: render plaintext <db>-debezium secrets so kind works without kubeseal (mirrors keycloak.devSecrets).
  # MUST stay false in prod; there they are committed as SealedSecrets (see platform/debezium/README.md).
  devSecrets: false
  dev:
    # dev-only password for the debezium replication role; the kafka-namespace Connect secret created by the
    # `debezium-kind-apply` justfile target uses the SAME value so the login matches. Prod uses sealed secrets.
    dbPassword: debezium-dev-pass
# PayPal sandbox credentials for the payments PSP integration (consumed via services.payments.paypal). In prod
# the `paypal-api` secret is committed as a SealedSecret (see deploy/README) and devSecrets stays false here. On
# kind, values-kind.yaml flips devSecrets=true and fills paypal.dev.* so the real sandbox PSP can be exercised
# without kubeseal. Get these from developer.paypal.com -> Sandbox -> a REST app with Advanced Card Payments
# enabled, plus a sandbox test card.
paypal:
  devSecrets: false
  dev:
    clientId: ""
    clientSecret: ""
    testCard:
      number: ""
      expiry: "" # YYYY-MM
      cvv: ""
# Price-quote signing key (the PRIVATE half of global.pricing) for Catalog, consumed as PRICE_QUOTE_SIGNING_KEY.
# In prod the `price-quote-signing` secret is committed as a SealedSecret and devSecrets stays false. On kind,
# values-kind.yaml flips devSecrets=true so templates/price-quote-secret.yaml renders the plaintext DEV private
# key below (which matches global.pricing.publicKey), letting the flow work without kubeseal.
priceQuote:
  devSecrets: false
  dev:
    # DEV-ONLY private JWK; matches the DEV public half in global.pricing.publicKey. Replace both together for prod.
    signingKey: '{"kty":"EC","d":"rRtoahvH5qqlroH0kU8YDvN05zDvvbP8rREjzUejhkc","crv":"P-256","kid":"price-quote-dev","x":"88QMkhVI-Xygzue616voDrIHFU9DZrxo91Np99RGL8I","y":"yE9kgtizYUeBDJCYNttyrHhAi5zWukU85bIHKr4CIc0","alg":"ES256"}'
# NOTE: `postgresql.synchronous` requires CloudNativePG >= 1.25
databases:
  catalog-db:
    # single instance: a read store that tolerates staleness needs no HA
    instances: 1
    # database name created by initdb (matches the app's DB_NAME)
    database: catalogdb
    # role that owns the schema (matches the app's DB_USER)
    owner: catalog
    # Keycloak SHARES this lower-tier instance (team decision): an extra CNPG-managed login role +
    # a declarative Database on the SAME cluster. Password comes from the keycloak-db secret.
    managedRoles:
      - name: keycloak
        secret: keycloak-db # keys: username, password
    extraDatabases:
      - name: keycloakdb
        owner: keycloak
  orders-db:
    # 2 instances: primary + one standby for fast failover
    instances: 2
    database: ordersdb
    owner: orders
    # RPO=0 while healthy, but never block order intake if the standby disappears
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
    # Debezium CDC drains the outbox off the WAL (see templates/databases.yaml): needs wal_level=logical + a replication role
    logicalReplication: true
    managedRoles:
      - name: debezium
        secret: orders-db-debezium # basic-auth (username=debezium, password); sealed under deploy/ (ns eurotransit)
        replication: true
  inventory-db:
    # 2 instances (primary + 1 sync standby). DECISION Part-2 (04/07, team decision = stay on
    # the free Students sub, 6 vCPU / 12 data-disk slots MAXED): the full-HA stack (3 inventory + 3 Kafka + 2
    # orders + 3 single-instance DBs + Prometheus) needs exactly 12 disks = the pool's hard ceiling, so cold-start
    # was a race with no slack and a different component (3rd broker / 3rd inventory / an app) lost each time.
    # Dropping inventory to 2 frees ONE disk slot -> 11/12 -> the race has headroom and the cluster converges
    # cleanly & deterministically. Trade-off (defensible, was already documented as the alternative): with 2
    # instances RPO is still 0 (dataDurability=required -> a commit waits for the 1 sync standby), but the price
    # is availability — if that single standby is down, writes BLOCK (vs 3 instances which tolerate losing one
    # standby and keep writing). We keep consistency over availability, which is the whole point of this DB.
    instances: 2
    database: inventorydb
    owner: inventory
    # required = consistency over availability: block writes rather than risk RPO > 0
    synchronous:
      method: any
      number: 1
      dataDurability: required
    logicalReplication: true
    managedRoles:
      - name: debezium
        secret: inventory-db-debezium
        replication: true
  payments-db:
    # single instance: correctness is the idempotency table, not replication (team decision)
    instances: 1
    database: paymentsdb
    owner: payments
    logicalReplication: true
    managedRoles:
      - name: debezium
        secret: payments-db-debezium
        replication: true
  users-db:
    # single instance: profile data is not on the money path and tolerates a short failover
    instances: 1
    database: usersdb
    owner: users
# Default container resources for the JVM services (no CPU limit ON PURPOSE: a CPU limit throttles a
# latency-sensitive JVM — esp. during JIT warmup — and hurts the ack SLO; the memory limit bounds the OOM
# blast radius instead). Sized from LIVE measurement on AKS (03/07): steady RSS was 310-422Mi (orders is
# the fleet outlier), i.e. the old 256Mi request UNDER-stated real use (scheduler booked less than reality
# -> node memory pressure the scheduler couldn't see) and the old 512Mi limit sat ~82% full at rest -> under
# load/chaos it brushed ~95% = OOM risk (the "pods at 95%" Riccardo saw on k9s). Now: request 384Mi = fleet
# steady-state (never below real for 5/6 services; orders' 422 is covered by the limit, a request is a
# scheduling floor, not a cap), limit 640Mi = peak + ~50% headroom so a GC/load spike never OOM-kills mid-chaos.
resources:
  # LIGHT tier (non-money-path: catalog, users, notifications). Live RSS 05/07 is 217-285Mi, so request 320Mi
  # stays comfortably ABOVE real use (slight over, never under — per the "don't under-provision" rule) while
  # freeing ~64Mi/pod of the old 384 booking. No CPU limit (throttling hurts the ack SLO); 512Mi memory ceiling.
  requests:
    cpu: 50m
    memory: 320Mi
  limits:
    memory: 512Mi
# CRITICAL tier (money path: orders, inventory, payments). Live RSS 05/07 is 356-391Mi with orders the fleet
# outlier peaking ~422Mi, so request 448Mi covers the peak (never under-books the money path); limit 640Mi keeps
# GC/load headroom so a spike never self-OOMs mid-chaos. Paired with the eurotransit-critical PriorityClass these
# pods are the LAST to be node-pressure-evicted. Selected per-service in _workload.tpl by svc.criticalPath.
criticalResources:
  requests:
    cpu: 50m
    memory: 448Mi
  limits:
    memory: 640Mi
# Resources for every PostgreSQL instance (applied to all Cluster CRs).
# CPU request 50m: real CNPG CPU is ~7-24m, so 50m is already a generous floor (kept; no CPU limit, same
# rationale as the services). Memory request lowered 256Mi -> 192Mi from LIVE measurement (03/07): the DBs
# use only 68-155Mi at rest, so 256Mi over-booked ~100Mi of phantom memory each x8 instances = ~800Mi the
# scheduler reserved but nobody used. 192Mi stays comfortably ABOVE the 155Mi peak (deliberately slightly
# over, never under). The 512Mi LIMIT is kept generous ON PURPOSE: a DB can spike on a failover / WAL replay
# / checkpoint, and this is exactly what chaos #5 exercises — we don't want a promotion to OOM.
# Quota is capped at 6 vCPU (no 4th node possible), so honest booking matters: freeing phantom reservations
# is how we make room without shrinking HA.
databaseResources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 512Mi
# Observability (Pillar D): what the kube-prometheus-stack should scrape and which SLO alerts to evaluate.
# Rendered by templates/observability.yaml into one ServiceMonitor per service + the checkout-SLO
# PrometheusRule. Turn the whole concern off with `enabled: false` — nothing is deleted, the CRs simply
# stop rendering (and any already-applied ones are pruned by Argo). If this block is removed entirely the
# template fails closed (renders nothing) rather than erroring, so it can never break the app deploy.
observability:
  enabled: true
  # Label value the kube-prometheus-stack matches to ADOPT our ServiceMonitors/PrometheusRule (its
  # serviceMonitorSelector/ruleSelector look for `release: <this>`). Must equal the Helm release name the
  # stack was installed under. A non-matching value makes the CRs inert (safe), never broken.
  prometheusRelease: kube-prometheus-stack
  # Checkout success-rate SLO target (0.99 = 99%). Error budget = 1 - target, the burn-rate denominator.
  # Kept as a STRING so it renders verbatim into the PromQL expressions (no float-formatting surprises).
  checkoutSuccessTarget: "0.99"
  # p99 objective in SECONDS for the synchronous POST /api/orders ack latency. String for the same reason.
  checkoutAckP99Seconds: "0.3"
  # Fase 4 — saga-completion SLI target: fraction of ACCEPTED orders (202) that must reach a TERMINAL state
  # (CONFIRMED or REJECTED) within the saga deadline. This is the signal the intake SLO cannot see: after
  # the async cutover a 202 no longer means the order completed. Terminal — not confirmed — on purpose:
  # SOLD_OUT / PAYMENT_DECLINED are correct outcomes the saga handled, they must not page anyone.
  sagaTerminalTarget: "0.99"
  # In-cluster Prometheus URL the Argo Rollouts AnalysisTemplates query (templates/analysis.yaml). The
  # kube-prometheus-stack is installed in namespace `monitoring` (see justfile kube-prometheus-install);
  # service name = <release>-prometheus.
  prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
