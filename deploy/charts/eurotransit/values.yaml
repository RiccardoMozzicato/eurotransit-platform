# EuroTransit -> desired application state (the chart's control panel: every template reads from here). CI (application repo) bumps "services.<svc>.image.tag" after a successful image build; Argo CD reconciles. Keep image tags as the only CI-mutated field!

# Values shared by all services / templates
global:
  # container registry that hosts the service images (TODO: capisci quale cluster e registry usiamo per il progetto)
  registry: lab02g03registry.azurecr.io
  # image path prefix: full image = <registry>/<imagePrefix>/<service>
  imagePrefix: eurotransit
  # public host the Ingress serves (TLS cert is issued for this name)
  domain: g03.cpo2026.it
  # cert-manager ClusterIssuer that signs the Ingress TLS cert (Secret eurotransit-tls).
  # Default = real Let's Encrypt (Argo CD / prod render base values.yaml only).
  # Local kind overrides this to "selfsigned" in values-kind.yaml (LE can't validate a laptop).
  clusterIssuer: letsencrypt-prod
  # Kafka bootstrap exposed by the Strimzi-managed cluster (platform namespace)
  kafkaBootstrap: eurotransit-kafka-bootstrap.kafka.svc:9092
  # OIDC contract injected into every secured service (validates Keycloak JWTs). The `issuer` MUST equal
  # the `iss` claim Keycloak stamps on tokens (the public frontend URL); jwkSetUri/tokenUri point at the
  # same public realm. kind overrides these in values-kind.yaml.
  oidc:
    issuer: https://auth.g03.cpo2026.it/realms/eurotransit
    jwkSetUri: https://auth.g03.cpo2026.it/realms/eurotransit/protocol/openid-connect/certs
    tokenUri: https://auth.g03.cpo2026.it/realms/eurotransit/protocol/openid-connect/token

# Keycloak (OIDC identity provider), run by the Keycloak Operator (installed separately as a platform
# component — see platform/argocd/keycloak-operator-application.yaml). The Keycloak CR + realm import live
# in THIS chart so they share the eurotransit namespace and the shared catalog Postgres instance.
keycloak:
  enabled: true
  # Quarkus distribution image the operator runs
  image: quay.io/keycloak/keycloak:26.0
  instances: 1
  # public host for the login UI (cert-manager issues its TLS cert); kind overrides this
  hostname: auth.g03.cpo2026.it
  # Keycloak's database lives on the SHARED catalog-db CNPG cluster (see databases.catalog-db below):
  # this is the host/db Keycloak connects to and the secret holding its DB role credentials.
  db:
    host: catalog-db-rw.eurotransit.svc
    name: keycloakdb
    secret: keycloak-db            # keys: username, password (also used by the CNPG managed role)
  # secret holding the bootstrap admin user (keys: username, password)
  adminSecret: keycloak-initial-admin
  # LOCAL-ONLY: render plain Secrets so kind works without kubeseal. MUST stay false in this base file;
  # in prod the three secrets (keycloak-db, keycloak-initial-admin, orders-oidc) are committed as
  # SealedSecrets (see platform/keycloak/README.md). values-kind.yaml flips this to true.
  devSecrets: false
  dev:
    adminUsername: admin
    adminPassword: admin
    dbPassword: keycloak-dev-pass
    ordersClientSecret: dev-orders-svc-secret

# Per-service desired state
# "db" references a database name in ".databases" (or null)
# "criticalPath" marks services on the money path (drives PDBs / spread / stricter SLOs)
# "hpa.enabled: true" lets the HPA own scaling -> the Deployment then omits "replicas", so Argo CD and the HPA don't fight over the replica count ("replicaCount" stays as the documented baseline and drives the PDB threshold)
services:
  catalog:
    image:
      # full image reference; "tag" is the only field CI rewrites (to the commit SHA)
      repository: lab02g03registry.azurecr.io/eurotransit/catalog
      tag: latest
      # IfNotPresent = don't re-pull if the tag is already cached on the node
      pullPolicy: IfNotPresent
    # baseline replica count (also the HPA floor / PDB reference)
    replicaCount: 2
    # container port the service listens on
    port: 8080
    # the CloudNativePG database this service owns (see "databases" below)
    db: catalog-db
    # OAuth2 resource server -> inject the OIDC env (global.oidc) so it validates Keycloak JWTs
    secured: true
    # NOT on the money path -> no PDB, no topology spread, looser SLOs
    criticalPath: false
    # does not produce/consume Kafka events -> no KAFKA_BOOTSTRAP injected
    usesKafka: false
    # Public read endpoint: bursty browse traffic is the natural HPA case
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70

  orders:
    image:
      repository: lab02g03registry.azurecr.io/eurotransit/orders
      tag: latest
      pullPolicy: IfNotPresent
    replicaCount: 2
    port: 8080
    db: orders-db
    # on the money path -> gets a PDB + topology spread
    criticalPath: true
    usesKafka: true
    # validates inbound user JWTs (resource server)
    secured: true
    # Orders also CALLS Inventory/Payments off the request thread (Kafka saga), so it mints a service token
    # via client credentials. clientId + the secret holding its client-secret (key: client-secret).
    oidcClient:
      clientId: orders-svc
      secretName: orders-oidc
    # The saga's synchronous decision calls (Orders -> Inventory/Payments) go to the in-cluster Service DNS names; locally the app falls back to localhost ports
    extraEnv:
      INVENTORY_BASE_URL: http://inventory:8080
      PAYMENTS_BASE_URL: http://payments:8080
    # Public sync entry of the money path: scale out under load instead of queueing to collapse (works together with load shedding / 429, Pillar C)
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70

  inventory:
    image:
      repository: lab02g03registry.azurecr.io/eurotransit/inventory
      tag: latest
      pullPolicy: IfNotPresent
    replicaCount: 2
    port: 8080
    db: inventory-db
    criticalPath: true
    usesKafka: true
    secured: true
    # Deliberately NO HPA: the bottleneck is the single contended row in PostgreSQL, not service CPU -> more replicas would not increase reservation throughput
    hpa:
      enabled: false

  payments:
    image:
      repository: lab02g03registry.azurecr.io/eurotransit/payments
      tag: latest
      pullPolicy: IfNotPresent
    replicaCount: 2
    port: 8080
    db: payments-db
    criticalPath: true
    usesKafka: true
    secured: true
    # Deliberately NO HPA: work is I/O-bound on the (mock) PSP + idempotency store
    hpa:
      enabled: false

  notifications:
    image:
      repository: lab02g03registry.azurecr.io/eurotransit/notifications
      tag: latest
      pullPolicy: IfNotPresent
    # single replica: this service is allowed to be fully down (graceful degradation)
    replicaCount: 1
    port: 8080
    # owns no database (almost stateless: an in-memory ring buffer only)
    db: null
    criticalPath: false
    usesKafka: true
    # Notifications has no inbound business REST API (Kafka-only) -> nothing to protect with a token
    secured: false
    # Allowed to fail entirely (graceful degradation): one replica, no HPA, no PDB
    hpa:
      enabled: false

  users:
    image:
      repository: lab02g03registry.azurecr.io/eurotransit/users
      tag: latest
      pullPolicy: IfNotPresent
    replicaCount: 2
    port: 8080
    # owns its own database (app-side profiles keyed by the Keycloak subject)
    db: users-db
    # OAuth2 resource server -> validates Keycloak JWTs; provisions profiles just-in-time
    secured: true
    # off the money path (profiles are not part of checkout)
    criticalPath: false
    usesKafka: false
    # self-service profile reads scale with logged-in browse traffic
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70



# CloudNativePG Cluster CRs (operator is platform-level). One DB per data-owning service!
#
# Replication posture = our PACELC statement made real: CNPG replicates ASYNCHRONOUSLY by default, which means a failover can lose the last committed transactions (RPO > 0). For inventory that would break "never oversell" exactly under chaos experiment #5 (a committed reservation vanishes, the seat counter rolls back, the seat is sold twice). Hence:
#
#   - inventory-db: SYNCHRONOUS replication, dataDurability=required → RPO=0 always. 3 instances (ANY 1 of 2 standbys) so losing ONE replica does not block writes; if the primary is partitioned from both standbys, writes BLOCK = consistency over availability (PACELC PC/EC). Resource-saving variant: 2 instances (1 pod less) is also defensible but blocks writes whenever the single standby is down
#
#   - orders-db: SYNCHRONOUS "preferred" → RPO=0 in normal operation, degrades to async instead of blocking order intake if the standby disappears (the money-path invariants do not live in orders-db; losing intake availability costs more)
#
#   - payments-db: single instance (team decision 09/06): not contended; no-double-charge is enforced by the idempotency table, not by replication; unavailability is contained by the Orders circuit breaker + fallback
#
#   - catalog-db: single instance; staleness-tolerant by definition
#
# NOTE: `postgresql.synchronous` requires CloudNativePG >= 1.25


databases:

  catalog-db:
    # single instance: a read store that tolerates staleness needs no HA
    instances: 1
    # database name created by initdb (matches the app's DB_NAME)
    database: catalogdb
    # role that owns the schema (matches the app's DB_USER)
    owner: catalog
    # Keycloak SHARES this lower-tier instance (team decision): an extra CNPG-managed login role +
    # a declarative Database on the SAME cluster. Password comes from the keycloak-db secret.
    managedRoles:
      - name: keycloak
        secret: keycloak-db        # keys: username, password
    extraDatabases:
      - name: keycloakdb
        owner: keycloak

  orders-db:
    # 2 instances: primary + one standby for fast failover
    instances: 2
    database: ordersdb
    owner: orders
    # RPO=0 while healthy, but never block order intake if the standby disappears
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  inventory-db:
    # 3 instances: survive losing ONE replica without blocking writes (the invariant store)
    instances: 3
    database: inventorydb
    owner: inventory
    # required = consistency over availability: block writes rather than risk RPO > 0
    synchronous:
      method: any
      number: 1
      dataDurability: required
  
  payments-db:
    # single instance: correctness is the idempotency table, not replication (team decision)
    instances: 1
    database: paymentsdb
    owner: payments

  users-db:
    # single instance: profile data is not on the money path and tolerates a short failover
    instances: 1
    database: usersdb
    owner: users

# Default container resources for the services (no CPU limit: avoid throttling spikes; memory limit bounds the JVM blast radius)
resources:
  # guaranteed share the scheduler reserves
  requests:
    cpu: 100m
    memory: 256Mi
  # hard ceiling (memory only -> a CPU limit would throttle latency-sensitive spikes)
  limits:
    memory: 512Mi

# Resources for every PostgreSQL instance (applied to all Cluster CRs)
databaseResources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
