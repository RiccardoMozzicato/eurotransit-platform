# EuroTransit app chart — LOCAL kind overlay. Layered on top of values.yaml:
#   helm ... -f values.yaml -f values-kind.yaml
# Only settings that differ on a laptop cluster belong here.

global:
  # Browser-resolvable app host for kind: *.localhost auto-resolves to 127.0.0.1 (no /etc/hosts), and
  # the realm client already allows https://<domain>/* + web origin, so the in-cluster SPA logs in with
  # no extra realm edits. Prod keeps g03.cpo2026.it (base values).
  domain: app.localhost
  # Let's Encrypt can't validate the host against a laptop, so locally we sign the Ingress TLS cert with
  # cert-manager's self-signed ClusterIssuer. The browser will warn "not trusted" — expected; the point
  # is to exercise the same TLS plumbing as production.
  clusterIssuer: selfsigned
  # No log aggregation stack on kind (observability stays disabled), so structured ECS JSON would be
  # write-only. Empty = human-readable plaintext console, so `kubectl logs` is directly readable (no jq).
  logFormat: ""
  # Local OIDC: tokens are issued for the kind ingress host (auth.localhost), but the services fetch
  # JWKS / mint service tokens over the in-cluster Service DNS (no ingress/TLS hairpin on a laptop).
  oidc:
    issuer: https://auth.localhost/realms/eurotransit
    jwkSetUri: http://keycloak-service.eurotransit.svc:8080/realms/eurotransit/protocol/openid-connect/certs
    tokenUri: http://keycloak-service.eurotransit.svc:8080/realms/eurotransit/protocol/openid-connect/token
  # Self-signed TLS on kind: keep HSTS OFF (stsSeconds 0) so a cert warning stays bypassable — HSTS would make
  # https://*.localhost cert errors non-recoverable. Keycloak is browser-reached at auth.localhost (CSP origin).
  securityHeaders:
    stsSeconds: 0
    keycloakOrigin: https://auth.localhost

# Local Keycloak: render plaintext dev secrets (no kubeseal on a laptop) and serve the login UI on the
# kind ingress host. Prod keeps devSecrets=false and uses committed SealedSecrets.
keycloak:
  hostname: auth.localhost
  devSecrets: true
  # let the local Vite frontend (http://localhost:5173) complete the login redirect, and allow the
  # password grant so test accounts can be exercised from the terminal (curl) — dev only.
  devDirectAccessGrants: true
  frontend:
    extraRedirectUris:
      - http://localhost:5173/*
    extraWebOrigins:
      - http://localhost:5173
  # ready-to-use logins seeded into the eurotransit realm on a fresh kind cluster (passwords = usernames)
  testUsers:
    - username: alice
      email: alice@eurotransit.test
      firstName: Alice
      lastName: Rider
      password: alice
      roles: [USER]
    - username: bob
      email: bob@eurotransit.test
      firstName: Bob
      lastName: Admin
      password: bob
      roles: [USER, ADMIN]

# Local Debezium: render plaintext <db>-debezium role secrets (no kubeseal on a laptop). Prod keeps
# devSecrets=false and uses committed SealedSecrets.
debezium:
  devSecrets: true

# Local PayPal (sandbox): render a plaintext `paypal-api` secret (no kubeseal on a laptop) from the values
# below. Payments stays on the MOCK PSP by default (services.payments.paypal.enabled:false above); to test the
# real sandbox PSP on kind, paste your sandbox REST-app credentials + a sandbox test card here and flip
# services.payments.paypal.enabled:true. Prod keeps devSecrets=false and a committed SealedSecret.
paypal:
  devSecrets: true
  dev:
    clientId: AQBbj5g_DvK-elKzcJRCKoE57IiYpX2D-2dMYzWNdJFCLJPKNEREL9p9M1biqv5snZeBETXjHBAYhuTf
    clientSecret: EM4SRKJ7Ox6PH2xywx4f58IJ_-E4HLcOVRJDmTPDBo-KC7fcCH8OWrAR8cHXTyv65Xu9SGBNfXsg8Osx
    testCard:
      # Must be a FRICTIONLESS (non-3DS) sandbox card: the server-to-server flow has no buyer, so a
      # card that triggers 3D Secure comes back PAYER_ACTION_REQUIRED (no authorization id) and the
      # authorize step throws → retries → DLT. 4111…1111 authorizes+captures with no payer action.
      # (4020022377146800 and 4000000000000002 both force 3DS and must NOT be used here.)
      number: "4111111111111111"   # quote it: an unquoted 16-digit number renders as a float (scientific notation)
      expiry: "2031-07"            # PayPal wants YYYY-MM (any future month)
      cvv: "123"

# Render the plaintext price-quote signing key on kind (no kubeseal). The DEV key in values.yaml matches
# global.pricing.publicKey, so catalog signs and orders verifies with a matching pair. Prod uses a SealedSecret.
priceQuote:
  devSecrets: true

# Use locally-built images from the kind local registry (localhost:5001) instead of ACR.
# Build + push them with `just images-kind`. Base values.yaml keeps the ACR repository for prod.
# pullPolicy: Always so a rebuilt :dev image is re-pulled on the next pod restart (dev loop).
services:
  catalog:
    image:
      repository: localhost:5001/eurotransit/catalog
      tag: dev
      pullPolicy: Always
  orders:
    image:
      repository: localhost:5001/eurotransit/orders
      tag: dev
      pullPolicy: Always
    # Fase 5 on a laptop: same canary strategy/mechanics as prod, but no Prometheus on kind -> the
    # SLO analysis is OFF (a template that can't reach Prometheus would abort every rollout) and the
    # ramp is compressed to a demo cadence. Promote/abort are exercised manually:
    #   kubectl argo rollouts -n eurotransit get rollout orders --watch | promote orders | abort orders
    rollout:
      canary:
        analysis:
          enabled: false
        # NB: a list OVERRIDES the base list wholesale (helm merge semantics) — this is the full kind ramp
        steps:
          - canaryReplicas: 1
            weight: 20
            pause: 30s
          - matchTrafficWeight: true
            weight: 50
            pause: 30s
  inventory:
    image:
      repository: localhost:5001/eurotransit/inventory
      tag: dev
      pullPolicy: Always
  payments:
    image:
      repository: localhost:5001/eurotransit/payments
      tag: dev
      pullPolicy: Always
    # kind default: keep payments on the in-app MOCK PSP so `just app-deploy` needs no PayPal credentials. To
    # exercise the REAL PayPal sandbox on kind: fill paypal.dev.* (below) and flip this to true.
    paypal:
      enabled: true
  notifications:
    image:
      repository: localhost:5001/eurotransit/notifications
      tag: dev
      pullPolicy: Always
  users:
    image:
      repository: localhost:5001/eurotransit/users
      tag: dev
      pullPolicy: Always

# Host the debug SPA in-cluster (served at https://app.localhost) so the whole app can be exercised
# from the browser without running any service locally. Built + pushed by `just images-kind`.
frontend:
  enabled: true
  # kind keeps the broad /api/inventory + /api/payments debug routes (the local debug SPA reads them directly).
  # Prod (base values.yaml) keeps this false so those internal surfaces are never publicly routed.
  exposeInternalDebugRoutes: true
  image:
    repository: localhost:5001/eurotransit/frontend
    tag: dev
    pullPolicy: Always

# `bootstrap-kind` does NOT install the kube-prometheus-stack (lighter laptop footprint — it's an opt-in
# Step 5 via `just observability-install`). So the ServiceMonitor/PrometheusRule CRDs are absent on a fresh
# kind cluster and the chart's observability CRs would fail to apply. Disable them here; the app deploys
# without monitoring wiring. To exercise observability on kind, run `just observability-install` first, then
# `helm ... --set observability.enabled=true` (or temporarily flip this). Prod keeps it on (base values).
observability:
  enabled: false