{{- /*
LOCAL-ONLY plaintext secrets for the Debezium replication role, so `just app-deploy` on kind works without
kubeseal. Rendered ONLY when debezium.devSecrets=true (set in values-kind.yaml). These hold the password
CloudNativePG assigns to each cluster's `debezium` managed role (see templates/databases.yaml).

In prod these <db>-debezium secrets are committed as SealedSecrets in the eurotransit namespace instead
(see platform/debezium/README.md) and devSecrets stays false — so nothing secret is ever rendered here.

The SAME password must reach the Kafka Connect cluster in the `kafka` namespace (Debezium logs in with it);
on kind the `debezium-kind-apply` justfile target creates that kafka-namespace secret with this value.
*/ -}}
{{- if .Values.debezium.devSecrets }}
{{- range $db := (list "orders-db" "inventory-db" "payments-db") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db }}-debezium
  labels:
    app.kubernetes.io/part-of: eurotransit
    app.kubernetes.io/name: debezium
type: kubernetes.io/basic-auth
stringData:
  username: debezium
  password: {{ $.Values.debezium.dev.dbPassword | quote }}
{{- end }}
{{- end }}
