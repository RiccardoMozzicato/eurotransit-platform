{{- /*
Fase 5 — weighted canary on the money-path entry (/api/orders), via Traefik CRDs.

Active only when `services.orders.canary.enabled` is true (otherwise the standard Ingress in ingress.yaml
keeps the /api/orders route, and these CRDs are not rendered). Requires the Traefik CRD provider
(platform/traefik/values.yaml: providers.kubernetesCRD) and the Traefik CRDs (shipped by the Traefik chart).

  IngressRoute (/api/orders) ──► TraefikService "orders-weighted" ──► { orders: 100-w , orders-canary: w }

Promotion is GitOps-native: bump `services.orders.canary.weight` (5 -> 50 -> 100) in values.yaml and commit,
watching the Fase-4 SLIs (checkout success-rate / ack p99). Rollback = weight 0 (or canary.enabled=false) + commit.
TLS reuses the `eurotransit-tls` cert that cert-manager still provisions via the standard Ingress (catalog/users).
*/ -}}
{{- $orders := .Values.services.orders }}
{{- $canary := $orders.canary | default dict }}
{{- if $canary.enabled }}
{{- $w := int (dig "weight" 5 $canary) }}
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: orders-weighted
  labels:
    {{- include "eurotransit.labels" (dict "svc" "orders" "root" $) | nindent 4 }}
spec:
  # Weighted round-robin between the two Orders Services. Weights are relative; we keep them summing to 100
  # so the value reads directly as "percent of /api/orders traffic to the canary".
  weighted:
    services:
      - name: orders
        port: {{ $orders.port }}
        weight: {{ sub 100 $w }}
      - name: orders-canary
        port: {{ $orders.port }}
        weight: {{ $w }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orders
  labels:
    {{- include "eurotransit.labels" (dict "svc" "orders" "root" $) | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.global.domain }}`) && PathPrefix(`/api/orders`)
      kind: Rule
      services:
        - name: orders-weighted
          kind: TraefikService
  tls:
    secretName: eurotransit-tls
{{- end }}
