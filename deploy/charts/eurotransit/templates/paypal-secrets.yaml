{{- /*
LOCAL-ONLY plaintext PayPal sandbox credentials so `just app-deploy` on kind can exercise the real PSP without
kubeseal. Rendered ONLY when paypal.devSecrets=true (set in values-kind.yaml). In prod the `paypal-api` secret
is committed as a SealedSecret in the eurotransit namespace instead (see deploy/README / platform docs) and
devSecrets stays false — so nothing secret is ever rendered from this chart in production.

Keys consumed by the payments Deployment (_workload.tpl, svc.paypal block):
  client-id, client-secret, test-card-number, test-card-expiry, test-card-cvv.
*/ -}}
{{- if .Values.paypal.devSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.services.payments.paypal.secretName }}
  labels:
    app.kubernetes.io/part-of: eurotransit
    app.kubernetes.io/name: payments
type: Opaque
stringData:
  client-id: {{ .Values.paypal.dev.clientId | quote }}
  client-secret: {{ .Values.paypal.dev.clientSecret | quote }}
  test-card-number: {{ .Values.paypal.dev.testCard.number | quote }}
  test-card-expiry: {{ .Values.paypal.dev.testCard.expiry | quote }}
  test-card-cvv: {{ .Values.paypal.dev.testCard.cvv | quote }}
{{- end }}
