{{- /*
1 Deployment + Service per entry in .Values.services
Probes follow the capstone rule: readiness reflects "can I serve now" (and, where a DB is owned, includes the db health group via the app config); liveness only checks the process itself and must NOT fail on transient downstream issues
*/ -}}

{{- /* one iteration per service: $name is the key, $svc is its config object */}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "eurotransit.labels" (dict "svc" $name "root" $) | nindent 4 }}
spec:
  {{- /* When the HPA owns scaling we omit "replicas": a pinned value would make Argo CD and the HPA fight over the count on every reconcile. */}}
  {{- if not (dig "hpa" "enabled" false $svc) }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  # the Deployment manages the pods carrying these stable labels
  selector:
    matchLabels:
      {{- include "eurotransit.selectorLabels" (dict "svc" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eurotransit.labels" (dict "svc" $name "root" $) | nindent 8 }}
    spec:
      # SIGTERM drain window (Pillar A): readiness flips to refusing traffic, in-flight work finishes or is cancelled cooperatively within this budget
      terminationGracePeriodSeconds: 30
      {{- if $svc.criticalPath }}
      # Spread critical-path pods across nodes so a single node loss can't take the service fully down (validated by the Node/AZ-disruption chaos experiment)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "eurotransit.selectorLabels" (dict "svc" $name) | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          # immutable image tag (the commit SHA) is bumped here by CI on every build
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          # Small pre-stop pause: lets endpoint controllers remove the Pod from the Service before SIGTERM arrives, so no new request races into a dying Pod
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          # the single port the Spring Boot app listens on (named "http" so probes can reuse it)
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            # Pod identity via the downward API, surfaced into the ECS logs as `service.node.name`
            # (Boot maps LOGGING_STRUCTURED_ECS_SERVICE_NODE_NAME -> logging.structured.ecs.service.node-name).
            # Makes "which replica produced this line" a queryable field, not just the live stream's source.
            # POD_NAME must be declared before the var that references it via $(POD_NAME).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOGGING_STRUCTURED_ECS_SERVICE_NODE_NAME
              value: $(POD_NAME)
            # every pod runs the in-cluster Spring profile (cluster hardening: quiet SQL, hidden health
            # details, ECS JSON logs) — applies to stateless services like notifications too, not just DB ones
            - name: SPRING_PROFILES_ACTIVE
              value: "cluster"
            # where to ship traces (OTLP); overrides the local default baked in the image
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: "http://otel-collector.observability.svc:4318/v1/traces"
            {{- if $svc.usesKafka }}
            # Kafka bootstrap address (only injected for services that produce/consume events)
            - name: KAFKA_BOOTSTRAP
              value: {{ $.Values.global.kafkaBootstrap | quote }}
            {{- end }}
            {{- /* Service-specific env (e.g. Orders' sibling-service base URLs). */}}
            {{- range $envName, $envValue := (dig "extraEnv" (dict) $svc) }}
            - name: {{ $envName }}
              value: {{ $envValue | quote }}
            {{- end }}
            {{- if $svc.secured }}
            {{- /* OAuth2 resource server: validate Keycloak JWTs. jwk-set-uri is lazy (no startup coupling); issuer is the claim check. */}}
            - name: KEYCLOAK_JWK_SET_URI
              value: {{ $.Values.global.oidc.jwkSetUri | quote }}
            - name: KEYCLOAK_ISSUER
              value: {{ $.Values.global.oidc.issuer | quote }}
            {{- end }}
            {{- if $svc.oidcClient }}
            {{- /* Client-credentials registration so this service can mint a SERVICE token for outbound calls (e.g. Orders -> Inventory/Payments off the Kafka thread). Secret is a SealedSecret in prod. */}}
            - name: KEYCLOAK_TOKEN_URI
              value: {{ $.Values.global.oidc.tokenUri | quote }}
            - name: ORDERS_CLIENT_ID
              value: {{ $svc.oidcClient.clientId | quote }}
            - name: ORDERS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.oidcClient.secretName }}
                  key: client-secret
            {{- end }}
            {{- if $svc.db }}
            {{- /* DB_* come from the `<db>-app` Secret that CloudNativePG generates itself -> credentials are never written into Git or this chart */}}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.db }}-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.db }}-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.db }}-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.db }}-app
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.db }}-app
                  key: password
            {{- end }}
          # readiness = "should I receive traffic NOW?" -> failing here removes the pod from the Service endpoints (but does NOT restart it)
          # periodSeconds = how often to check; failureThreshold = consecutive failures before flipping NotReady
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # liveness = "is the process wedged?" -> failing here RESTARTS the pod, so it checks only the app itself (never a downstream), to avoid restart storms on a blip
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          # startup = slow-boot grace: up to 24*5s = 2 min for the JVM to come up before liveness starts counting (so a slow start is not mistaken for a hang)
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          # CPU/memory requests+limits shared by all services (see values.yaml "resources")
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
---
# stable in-cluster address for the service: other pods reach it as http://<name>:<port>
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "eurotransit.labels" (dict "svc" $name "root" $) | nindent 4 }}
spec:
  # ClusterIP = internal only; the public edge is the Ingress (Catalog/Orders only)
  type: ClusterIP
  selector:
    {{- include "eurotransit.selectorLabels" (dict "svc" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
{{- end }}
