{{- /*
LOCAL-ONLY plaintext secrets so `just app-deploy` on kind works without kubeseal. Rendered ONLY when
keycloak.devSecrets=true (set in values-kind.yaml). In prod these THREE secrets are committed as
SealedSecrets in the eurotransit namespace instead (see platform/keycloak/README.md) and devSecrets
stays false — so nothing secret is ever rendered from this chart in production.

  - keycloak-db           : the CNPG-managed `keycloak` role creds (also used by the Keycloak CR's DB)
  - keycloak-bootstrap-admin: the bootstrap admin user for the Keycloak console
  - orders-oidc           : the orders-svc client secret Orders reads (must equal the realm client secret)
*/ -}}
{{- if and .Values.keycloak.enabled .Values.keycloak.devSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.db.secret }}
  labels:
    app.kubernetes.io/part-of: eurotransit
    app.kubernetes.io/name: keycloak
type: kubernetes.io/basic-auth
stringData:
  username: keycloak
  password: {{ .Values.keycloak.dev.dbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.adminSecret }}
  labels:
    app.kubernetes.io/part-of: eurotransit
    app.kubernetes.io/name: keycloak
type: Opaque
stringData:
  username: {{ .Values.keycloak.dev.adminUsername | quote }}
  password: {{ .Values.keycloak.dev.adminPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.services.orders.oidcClient.secretName }}
  labels:
    app.kubernetes.io/part-of: eurotransit
    app.kubernetes.io/name: orders
type: Opaque
stringData:
  client-secret: {{ .Values.keycloak.dev.ordersClientSecret | quote }}
{{- end }}
