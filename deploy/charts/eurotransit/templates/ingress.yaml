{{- /*
North-south entrypoint (Traefik + cert-manager TLS)

Public (client -> gateway -> service): Catalog, Orders, Users — plus, when the frontend is served here, the SPA at "/", the secured Notifications SSE stream, and a NARROW inventory read (/api/inventory/availability). Payments and the broad Inventory surface stay internal: reached via Kafka (the async saga), never directly from the internet! (The dev-only broad /api/inventory + /api/payments debug routes are gated separately on frontend.exposeInternalDebugRoutes.)

Each service serves under its own path prefix (e.g. /api/orders, /api/catalog), so no strip-prefix middleware is needed. Fase 5: when orders runs the CANARY strategy its route moves to a Traefik IngressRoute + weighted TraefikService (progressive-delivery.yaml); blue/green keeps the plain route below (the Rollouts controller flips the Service selector instead).
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eurotransit
  annotations:
    # cert-manager watches this annotation and provisions/renews the TLS cert automatically.
    # The issuer name is environment-specific: "letsencrypt-prod" on the real cluster,
    # "selfsigned" on local kind (set via global.clusterIssuer in values.yaml / values-kind.yaml).
    cert-manager.io/cluster-issuer: {{ .Values.global.clusterIssuer }}
    {{- if .Values.global.securityHeaders.enabled }}
    # Attach the security-headers Middleware (templates/security-headers.yaml) to every router this Ingress
    # generates, so the SPA and all /api/* paths get HSTS/CSP-Report-Only/frame/nosniff/referrer uniformly.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-security-headers@kubernetescrd
    {{- end }}
spec:
  # route through the Traefik ingress controller (installed once as a platform component)
  ingressClassName: traefik
  # terminate HTTPS for our host; cert-manager stores the cert in this secret
  tls:
    - hosts:
        - {{ .Values.global.domain }}
      secretName: eurotransit-tls
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          # /api/catalog/** -> the Catalog service (public browse API)
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog
                port:
                  number: {{ .Values.services.catalog.port }}
          {{- if ne (dig "rollout" "strategy" "" .Values.services.orders) "canary" }}
          # /api/orders/** -> the Orders service (public money-path entry). Also the blue/green path: there
          # the Rollouts controller flips THIS Service's selector on promotion, the route never changes.
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: {{ .Values.services.orders.port }}
          {{- else }}
          # /api/orders is owned by the canary IngressRoute -> weighted TraefikService whose weights the
          # Argo Rollouts controller drives (progressive-delivery.yaml). Kept out of this Ingress to avoid
          # a duplicate route.
          {{- end }}
          # /api/users/** -> the Users service (self-service profile; the SPA calls it with the user token)
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: users
                port:
                  number: {{ .Values.services.users.port }}
          {{- if .Values.frontend.enabled }}
          {{- /*
          PRODUCTION frontend (frontend.enabled): serve the SPA plus the public routes it needs — the secured
          Notifications SSE stream and a NARROW inventory read. These do NOT open the internal services broadly:
          notifications + inventory both validate the user's JWT, and only /api/inventory/availability is routed
          (never the /api/inventory prefix or the /items debug reads; payments is never routed at all). The "/"
          catch-all serves the SPA for everything that isn't /api/* — Traefik prefers the longer /api/<svc>
          prefixes (and the canary /api/orders IngressRoute), so API calls still reach the services.
          */}}
          # /api/notifications/** -> Notifications (the secured SSE stream the SPA opens for live saga updates)
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notifications
                port:
                  number: {{ .Values.services.notifications.port }}
          # /api/inventory/availability -> Inventory: ONLY the public seat-count read (paginated DTO). The broad
          # /api/inventory prefix and the /items debug reads are NOT routed here — they stay internal in prod.
          - path: /api/inventory/availability
            pathType: Prefix
            backend:
              service:
                name: inventory
                port:
                  number: {{ .Values.services.inventory.port }}
          {{- if .Values.frontend.exposeInternalDebugRoutes }}
          {{- /*
          DEV-ONLY (frontend.exposeInternalDebugRoutes): the local debug SPA also reads the BROAD inventory
          surface (/items) and payments directly. NEVER true in prod — Inventory and Payments stay internal
          there (reached only via Kafka). values-kind.yaml flips this on; base/prod keeps it false.
          */}}
          # /api/inventory/** -> Inventory (debug: full seat counts + /items)
          - path: /api/inventory
            pathType: Prefix
            backend:
              service:
                name: inventory
                port:
                  number: {{ .Values.services.inventory.port }}
          # /api/payments/** -> Payments (debug: authorization outcome)
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payments
                port:
                  number: {{ .Values.services.payments.port }}
          {{- end }}
          # everything else -> the static SPA (history-mode fallback handled by nginx)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.port }}
          {{- end }}
