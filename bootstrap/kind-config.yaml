kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: eurotransit

# Enable containerd's registry config dir so the cluster can pull from the local dev registry
# (kind-registry on localhost:5001). The per-node hosts.toml mapping localhost:5001 ->
# http://kind-registry:5000 is written by `just registry-up` after the cluster is created.
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"

nodes:
- role: control-plane
  image: kindest/node:v1.31.2
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
- role: worker
  image: kindest/node:v1.31.2
- role: worker
  image: kindest/node:v1.31.2